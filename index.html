<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DON'T TOUCH — NTH</title>
<style>
:root{--cyan:#48f5ff;--pink:#ff315e;--gold:#ffd34d}
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b18;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{display:grid;place-items:center;background:radial-gradient(ellipse at 50% 15%,#17264b 0,#090e20 48%,#040610 100%)}
#wrap{position:relative;width:min(100vw,520px);height:min(100dvh,900px);min-height:500px;overflow:hidden;background:linear-gradient(180deg,#101a35,#070b18);border:1px solid #27365c;box-shadow:0 0 50px #1c77ff22}
canvas{width:100%;height:100%;display:block}
#hud{position:absolute;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;font-weight:800;text-shadow:0 2px 8px #000}
.pill{background:#0b1530cc;border:1px solid #345078;border-radius:14px;padding:8px 12px;font-size:13px}
#brand{position:absolute;top:58px;left:0;right:0;text-align:center;pointer-events:none}
#brand b{font-size:20px;letter-spacing:4px;color:#eafcff;text-shadow:0 0 12px #48f5ff}
#brand small{display:block;margin-top:4px;color:#7e9cbd;letter-spacing:5px;font-size:9px}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;background:linear-gradient(#081127d9,#070b18ee)}
.hidden{display:none!important}
.logo{width:104px;height:104px;border-radius:28px;border:2px solid #48f5ff;display:grid;place-items:center;margin-bottom:22px;box-shadow:0 0 24px #48f5ff55,inset 0 0 24px #48f5ff22;transform:rotate(-7deg)}
.logo span{font-size:38px;font-weight:1000;color:#fff;text-shadow:0 0 16px #48f5ff;transform:rotate(7deg)}
h1{font-size:clamp(30px,8vw,44px);letter-spacing:3px;margin:0;color:#fff;text-shadow:0 0 18px #48f5ff66}
.sub{color:#9bb3d5;margin:10px 0 26px;letter-spacing:2px;font-size:12px}
button{border:0;border-radius:14px;padding:14px 26px;font-weight:900;letter-spacing:2px;color:#06101e;background:linear-gradient(100deg,#48f5ff,#82ffce);box-shadow:0 7px 24px #48f5ff44;font-size:15px;cursor:pointer}
.hint{font-size:12px;line-height:1.7;color:#9cb0cc;margin-top:20px;max-width:300px}
#mobile{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}
.pad{display:flex;gap:10px;pointer-events:auto}
.pad button{width:58px;height:54px;padding:0;border-radius:16px;font-size:22px;letter-spacing:0;background:#122448dd;color:#dffcff;border:1px solid #3a6590;box-shadow:none;touch-action:none}
#shoot{background:#6d1830dd;border-color:#ff5375;color:#fff;font-size:12px}
#sound{position:absolute;right:14px;top:58px;background:#0b1530cc;color:#cdefff;border:1px solid #345078;padding:7px 10px;font-size:11px;box-shadow:none}
#result p{color:#a9bdd8;line-height:1.6}
</style>
</head>
<body>
<div id="wrap">
<canvas id="game"></canvas>
<div id="hud"><div class="pill">SCORE <span id="score">0</span></div><div class="pill">✦ <span id="ammo">0</span></div></div>
<div id="brand"><b>DON'T TOUCH</b><small>BY NTH</small></div>
<button id="sound">SON : ON</button>
<div id="menu" class="overlay">
  <div class="logo"><span>NTH</span></div>
  <h1>DON'T TOUCH</h1><div class="sub">SURVIVE • BREAK • LEVEL UP</div>
  <button id="start">JOUER</button>
  <div class="hint">← → ou A / D pour bouger<br>Récupère les étoiles ✦ pour tirer<br>Évite les blocs rouges. Tiens le plus longtemps possible !</div>
</div>
<div id="result" class="overlay hidden">
  <div class="logo"><span>NTH</span></div><h1>GAME OVER</h1>
  <p>Score : <b id="finalScore">0</b><br>Record : <b id="best">0</b></p>
  <button id="again">REJOUER</button>
</div>
<div id="mobile">
 <div class="pad"><button id="left">◀</button><button id="right">▶</button></div>
 <div class="pad"><button id="shoot">TIR ✦</button></div>
</div>
</div>
<script>
(()=> {
const c=document.getElementById('game'),ctx=c.getContext('2d'),wrap=document.getElementById('wrap');
const scoreEl=document.getElementById('score'),ammoEl=document.getElementById('ammo');
let W=520,H=900,raf=0,running=false,score=0,ammo=0,speed=3.4,frame=0,blocks=[],stars=[],shots=[],particles=[],boss=null;
let player={x:260,y:760,r:13},keys={},move=0,best=Number(localStorage.getItem('nthBest')||0),sound=true;
function resize(){const dpr=Math.min(devicePixelRatio||1,2),r=wrap.getBoundingClientRect();W=r.width;H=r.height;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);player.y=H*.82;if(!running)player.x=W/2}
window.addEventListener('resize',resize);resize();
function reset(){score=0;ammo=0;speed=3.4;frame=0;blocks=[];stars=[];shots=[];particles=[];boss=null;player.x=W/2;scoreEl.textContent='0';ammoEl.textContent='0'}
function start(){cancelAnimationFrame(raf);reset();running=true;document.getElementById('menu').classList.add('hidden');document.getElementById('result').classList.add('hidden');loop()}
function end(){running=false;best=Math.max(best,score);localStorage.setItem('nthBest',best);document.getElementById('finalScore').textContent=score;document.getElementById('best').textContent=best;document.getElementById('result').classList.remove('hidden')}
function fire(){if(!running||ammo<=0)return;ammo--;ammoEl.textContent=ammo;shots.push({x:player.x,y:player.y-15,vy:10});}
function spawn(){let lane=Math.random()*(W-60)+30;blocks.push({x:lane,y:-35,w:28+Math.random()*24,h:28+Math.random()*25,hp:1,kind:'red'});if(Math.random()<.25)stars.push({x:Math.random()*(W-40)+20,y:-20,r:9})}
function drawBg(){ctx.fillStyle='#080e20';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#142344';ctx.lineWidth=1;for(let x=0;x<W;x+=38){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=(frame*speed*.6)%38;y<H;y+=38){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}}
function burst(x,y,color){for(let i=0;i<9;i++)particles.push({x,y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,life:22,color})}
function loop(){if(!running)return;raf=requestAnimationFrame(loop);frame++;score+=1;speed+=.0017;scoreEl.textContent=score;
 drawBg();
 if(keys.ArrowLeft||keys.a||move<0)player.x-=6;if(keys.ArrowRight||keys.d||move>0)player.x+=6;player.x=Math.max(player.r+4,Math.min(W-player.r-4,player.x));
 if(frame%Math.max(13,Math.floor(44-speed*3))===0)spawn();
 if(score>0&&score%500===0&&!boss)boss={x:W/2-42,y:-80,w:84,h:42,hp:12};
 for(let i=blocks.length-1;i>=0;i--){let b=blocks[i];b.y+=speed;ctx.shadowBlur=15;ctx.shadowColor='#ff315e';ctx.fillStyle='#ff315e';ctx.fillRect(b.x-b.w/2,b.y,b.w,b.h);ctx.shadowBlur=0;if(b.y>H+50)blocks.splice(i,1);else if(Math.abs(player.x-b.x)<b.w/2+player.r-3&&Math.abs(player.y-(b.y+b.h/2))<b.h/2+player.r-3){end();return}}
 for(let i=stars.length-1;i>=0;i--){let s=stars[i];s.y+=speed*.85;ctx.fillStyle='#ffd34d';ctx.shadowBlur=18;ctx.shadowColor='#ffd34d';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;if(Math.hypot(s.x-player.x,s.y-player.y)<s.r+player.r){ammo+=2;ammoEl.textContent=ammo;burst(s.x,s.y,'#ffd34d');stars.splice(i,1)}else if(s.y>H+20)stars.splice(i,1)}
 for(let i=shots.length-1;i>=0;i--){let q=shots[i];q.y-=q.vy;ctx.fillStyle='#48f5ff';ctx.shadowBlur=12;ctx.shadowColor='#48f5ff';ctx.fillRect(q.x-3,q.y-10,6,15);ctx.shadowBlur=0;let hit=false;for(let j=blocks.length-1;j>=0;j--){let b=blocks[j];if(q.x>b.x-b.w/2-4&&q.x<b.x+b.w/2+4&&q.y>b.y-8&&q.y<b.y+b.h+8){blocks.splice(j,1);burst(b.x,b.y,'#ff315e');score+=15;hit=true;break}}if(boss&&q.x>boss.x&&q.x<boss.x+boss.w&&q.y>boss.y&&q.y<boss.y+boss.h){boss.hp--;hit=true;if(boss.hp<=0){burst(boss.x+boss.w/2,boss.y,'#ff315e');score+=100;ammo+=3;ammoEl.textContent=ammo;boss=null}}if(hit||q.y<-30)shots.splice(i,1)}
 if(boss){boss.y+=speed*.45;ctx.fillStyle='#9c123a';ctx.shadowBlur=22;ctx.shadowColor='#ff315e';ctx.fillRect(boss.x,boss.y,boss.w,boss.h);ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.font='bold 12px Arial';ctx.fillText('BOSS '+boss.hp,boss.x+15,boss.y-8);if(boss.y>H+30)boss=null}
 for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx;p.y+=p.vy;p.life--;ctx.globalAlpha=p.life/22;ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,4,4);ctx.globalAlpha=1;if(p.life<=0)particles.splice(i,1)}
 // player glow orb
 ctx.shadowBlur=24;ctx.shadowColor='#48f5ff';const grad=ctx.createRadialGradient(player.x-4,player.y-5,2,player.x,player.y,player.r+5);grad.addColorStop(0,'#ffffff');grad.addColorStop(.35,'#a9ffff');grad.addColorStop(1,'#16a5ff');ctx.fillStyle=grad;ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
 }
document.getElementById('start').onclick=start;document.getElementById('again').onclick=start;
document.getElementById('sound').onclick=e=>{sound=!sound;e.target.textContent='SON : '+(sound?'ON':'OFF')};
window.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '){e.preventDefault();fire()}});window.addEventListener('keyup',e=>keys[e.key]=false);
function hold(id,val){let el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();move=val});['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,()=>{if(move===val)move=0}))}
hold('left',-1);hold('right',1);document.getElementById('shoot').addEventListener('pointerdown',e=>{e.preventDefault();fire()});
c.addEventListener('pointermove',e=>{if(running&&e.pointerType==='touch'){let r=c.getBoundingClientRect();player.x=e.clientX-r.left}});
c.addEventListener('pointerdown',e=>{if(running&&e.pointerType==='touch'){let r=c.getBoundingClientRect();player.x=e.clientX-r.left}});
})();
</script>
</body></html>
